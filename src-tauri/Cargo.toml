[package]
name = "moyu"
version = "0.1.0"
description = "A small, quiet, keyboard-driven novel reader"
authors = ["Moyu contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "moyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
scraper = "0.24"
ego-tree = "0.10"
percent-encoding = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
