# Copy into ~/.config/sway/config. Adjust executable path if necessary.
for_window [app_id="^app\.moyu\.reader$"] floating enable, border none
bindsym --no-repeat Ctrl+Mod1+m exec moyu --toggle

# Floating windows sit above tiled windows; other floating/fullscreen windows
# may cover the reader. Do not confuse "sticky" with always-on-top.
