# Hyprland 0.53+ syntax; copy into your Hyprland config.
# Keep compositor opacity at 1: Moyu handles text/background separately.
windowrule {
    name = moyu-reader
    match:class = ^(app.moyu.reader)$
    float = on
    border_size = 0
    focus_on_activate = on
}
bind = CTRL ALT, M, exec, moyu --toggle

# For Hyprland <= 0.52 use the equivalent older rules instead:
# windowrulev2 = float,class:^(app\.moyu\.reader)$
# windowrulev2 = noborder,class:^(app\.moyu\.reader)$
